[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-voice-narration"
version = "0.2.0"
description = "OmniVoice narration for gratitude stories with canonical content extraction"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "gradio-client>=2,<3",
    "scipy>=1.14,<2",
    "beautifulsoup4>=4.15,<5",
    "imageio-ffmpeg>=0.6,<1",
    "numpy>=2,<3",
    "soundfile>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "boto3>=1.34,<2",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.12,<1",
]

[project.scripts]
omni-narrate = "generate_narration:main"
omni-audition = "story_audition:main"
omni-colab = "colab_runtime:main"
omni-master = "narration_mastering:main"
pocket-tts-narrate = "generate_narration:main"

[tool.setuptools]
py-modules = ["speech_engine", "omni_native", "transcript_quality", "colab_runtime", "gpu_worker", "narration_mastering", "spectral_matching", "speaker_similarity", "generate_narration", "omni_voice", "storytelling", "story_audio", "story_audition", "local_test", "worker_document", "extractor", "narration_script"]
packages = ["narration_content"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
